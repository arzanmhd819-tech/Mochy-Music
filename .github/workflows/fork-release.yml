name: Build and publish Mochy fork release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build signed universal APK and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;27.0.12077973"

      - name: Validate signing secrets and install signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing STORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          mkdir -p app/keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          test -s app/keystore/release.keystore

      - name: Calculate app version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) APP_VERSION_NAME="${TAG#v}" ;;
            *) echo "Release tag must start with v (example v8.3.3)"; exit 1 ;;
          esac
          # The official app in this source starts at versionCode 73.
          # GitHub's run number increases for every published build.
          APP_VERSION_CODE=$((73 + GITHUB_RUN_NUMBER))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_version_name=$APP_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "app_version_code=$APP_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building $APP_VERSION_NAME (versionCode $APP_VERSION_CODE)"

      - name: Build signed universal FOSS APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleUniversalFossRelease \
            -PAPP_VERSION_CODE="${{ steps.version.outputs.app_version_code }}" \
            -PAPP_VERSION_NAME="${{ steps.version.outputs.app_version_name }}"

      - name: Prepare updater-compatible APK assets
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -path '*universalFoss/release*' -print -quit)"
          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk -type f -name '*.apk' -path '*release*' -print -quit)"
          fi
          test -n "$APK" || { echo "Universal FOSS release APK was not found"; find app/build/outputs/apk -type f -name '*.apk'; exit 1; }
          mkdir -p release-assets
          cp "$APK" release-assets/mochy.apk
          # The newer updater selects the universal APK by this filename.
          cp "$APK" release-assets/mochy-universal.apk
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Mochy ${{ steps.version.outputs.app_version_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/mochy.apk
            release-assets/mochy-universal.apk
