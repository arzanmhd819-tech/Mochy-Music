name: Fast (Profileable) Build

on:
  workflow_dispatch:
  push:
    branches: [ "feature/spotify-style-queue" ]

permissions:
  contents: write

jobs:
  build_fast:
    name: Build Universal GMS Profileable (release speed)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Profileable APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          ./gradlew assembleUniversalGmsProfileable --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload Profileable APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-gms-profileable
          path: app/build/outputs/apk/universalGms/profileable/*.apk
          # release-speed test build, kept for a week
          retention-days: 7

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SRC=$(ls app/build/outputs/apk/universalGms/profileable/*.apk | head -n 1)
          APK="Mochy-Reloaded.apk"
          cp "$SRC" "$APK"
          SHA=$(git rev-parse HEAD)
          # one rolling release: the old one is replaced by the newest build
          gh release delete mochy-reloaded-latest --cleanup-tag --yes || true
          gh release create mochy-reloaded-latest "$APK" \
            --target "$SHA" \
            --prerelease \
            --title "Mochy Reloaded" \
            --notes "Mochy Reloaded, Spotify-style queue build (commit ${SHA:0:7}). Replaced by each new build."
